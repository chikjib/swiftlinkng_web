name: Deploy Swiftlink to cPanel

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftlink-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
      CPANEL_PATH: ${{ secrets.CPANEL_PATH }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
      MIX_APP_URL: ${{ vars.MIX_APP_URL }}
      MIX_APP_NAME: ${{ vars.MIX_APP_NAME }}
      MIX_SESSION_LIFETIME: ${{ vars.MIX_SESSION_LIFETIME }}
      MIX_RAVE_PUBLICKEY: ${{ secrets.MIX_RAVE_PUBLICKEY }}
     
    steps:
      - name: Check deployment configuration
        id: preflight
        shell: bash
        run: |
          missing=()
          for name in CPANEL_HOST CPANEL_USER CPANEL_PORT CPANEL_PATH CPANEL_SSH_KEY CPANEL_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Configure these GitHub Actions secrets: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out application
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up PHP
        if: steps.preflight.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo_mysql, xml, zip

      - name: Install production PHP dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-scripts

      - name: Set up Node
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps

      - name: Build Vite assets
        if: steps.preflight.outputs.ready == 'true'
        run: npm run build

      - name: Configure SSH
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/swiftlink_deploy"
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/swiftlink_deploy"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload application to public_html
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          rsync -az \
            -e "ssh -i $HOME/.ssh/swiftlink_deploy -p $CPANEL_PORT" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env*' \
            --exclude='.cpanel.yml' \
            --exclude='.ftp-deploy-sync-state.json' \
            --exclude='.ftpquota' \
            --exclude='.user.ini' \
            --exclude='php.ini' \
            --exclude='cookie.txt' \
            --exclude='node_modules/' \
            --exclude='public/hot' \
            --exclude='public/storage' \
            --exclude='storage/app/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='tests/' \
            ./ "$CPANEL_USER@$CPANEL_HOST:$CPANEL_PATH/"

      - name: Finish Laravel deployment
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/swiftlink_deploy" \
            -p "$CPANEL_PORT" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "cd '$CPANEL_PATH' &&
             php artisan package:discover --ansi &&
             php artisan optimize:clear &&
             php artisan config:cache &&
             php artisan view:cache &&
             chmod -R ug+rwX storage bootstrap/cache"
